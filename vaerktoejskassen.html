<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Værktøjskassen – opsamling på arkæologiforløbet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Zilla+Slab:wght@500;700&display=swap" rel="stylesheet">
<style>

:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#E8EDE9; --card:#FFFFFF; --soft:#F3F6F4; --ink:#1B2A2F; --muted:#55666A; --line:#C6D0CA;
  --accent:#1F5FA8; --accent-ink:#FFFFFF;
  --ok:#23764A; --ok-bg:#E2F1E7; --bad:#A8322A; --bad-bg:#F8E5E2; --hint-bg:#FBF0D6;
  --m-sr:#6E4A9E; --m-c14:#1F5FA8; --m-dendro:#8A5A2B; --m-strat:#8C6A00; --m-typo:#257566; --m-osteo:#9C3D54; --m-other:#55666A;
  --gold:#B38A2E; --soil1:#6B5A45; --soil2:#B79A6A; --soil3:#8C7A5C; --char:#3A3431; --sand:#D9C38F; --brick:#A4553A;
  --serif:'Zilla Slab', Rockwell, 'Roboto Slab', Georgia, serif;
  --sans:'Atkinson Hyperlegible', 'Segoe UI', Verdana, Arial, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11181A; --card:#1A2326; --soft:#161E21; --ink:#E4ECE9; --muted:#9CAFB0; --line:#34423F;
    --accent:#7BAAE8; --accent-ink:#0D1824;
    --ok:#6BC896; --ok-bg:#15301F; --bad:#F08B7F; --bad-bg:#3A1C19; --hint-bg:#342B14;
    --m-sr:#B397DB; --m-c14:#7BAAE8; --m-dendro:#D39B63; --m-strat:#D8B447; --m-typo:#5DC4AE; --m-osteo:#E28BA1; --m-other:#9CAFB0;
    --gold:#D9B45A; --soil1:#7A6850; --soil2:#9E8660; --soil3:#6E604A; --char:#2A2523; --sand:#B8A276; --brick:#B4674B;
  }
}
:root[data-theme="dark"]{
  --paper:#11181A; --card:#1A2326; --soft:#161E21; --ink:#E4ECE9; --muted:#9CAFB0; --line:#34423F;
  --accent:#7BAAE8; --accent-ink:#0D1824;
  --ok:#6BC896; --ok-bg:#15301F; --bad:#F08B7F; --bad-bg:#3A1C19; --hint-bg:#342B14;
  --m-sr:#B397DB; --m-c14:#7BAAE8; --m-dendro:#D39B63; --m-strat:#D8B447; --m-typo:#5DC4AE; --m-osteo:#E28BA1; --m-other:#9CAFB0;
  --gold:#D9B45A; --soil1:#7A6850; --soil2:#9E8660; --soil3:#6E604A; --char:#2A2523; --sand:#B8A276; --brick:#B4674B;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:1.0625rem;line-height:1.55}
img,svg{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--serif);line-height:1.15;margin:0 0 .4em}
p{margin:0 0 .8em}

.bar{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--card)}
.bar .brand{font-family:var(--serif);font-weight:700;font-size:1.2rem}
.bar .spacer{flex:1}
.wrap{max-width:940px;margin:0 auto;padding:24px 20px 60px}

.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:10px 16px;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{padding:6px 10px;font-size:.92rem}
.linkbtn{background:none;border:0;color:var(--accent);cursor:pointer;padding:4px 0;font-weight:700}
.say{background:transparent;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.85rem;cursor:pointer;color:var(--muted);white-space:nowrap}
.say:hover{color:var(--ink);border-color:var(--muted)}

/* Forside */
.hero{margin:18px 0 28px;max-width:62ch}
.hero h1{font-size:clamp(2.2rem,6vw,3.6rem);font-weight:700;letter-spacing:-.01em}
.hero p{font-size:1.15rem;color:var(--muted)}
.tags{display:grid;grid-template-columns:1fr;gap:18px}
@media (min-width:720px){.tags{grid-template-columns:1fr 1fr}}
.tag{position:relative;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:4px 14px 14px 4px;padding:20px 20px 18px 50px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.tag::before{content:"";position:absolute;left:17px;top:24px;width:14px;height:14px;border-radius:50%;background:var(--paper);border:2px solid var(--line)}
.tag:hover{border-color:var(--muted)}
.tag .nr{font-size:.9rem;color:var(--muted)}
.tag h3{font-size:1.4rem;margin:0}
.tag .place{color:var(--muted);font-size:.95rem}
.tag .teaser{font-size:.98rem;margin:4px 0 6px}
.tag .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:auto}
.status{font-size:.88rem;color:var(--muted)}
.status.done{color:var(--ok);font-weight:700}
.stamp{display:inline-block;font-family:var(--serif);font-weight:700;color:var(--c);border:2px solid var(--c);border-radius:4px;padding:1px 9px;transform:rotate(-3deg);font-size:1rem;background:var(--card);white-space:nowrap}
.stamp.sm{font-size:.82rem;padding:0 6px;border-width:1.5px;transform:none}
.foot-note{margin-top:36px;color:var(--muted);font-size:.93rem;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}

/* Sag */
.casehead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.casehead h2{font-size:clamp(1.7rem,4.5vw,2.4rem);margin:0}
.casehead .place{color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tabs button{background:none;border:0;padding:10px 14px;cursor:pointer;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px}
.panel + .panel{margin-top:18px}
.story{font-size:1.1rem;max-width:68ch}
.finds{margin:6px 0 0;padding-left:1.2em}
.finds li{margin:3px 0}
.primer{background:var(--soft);border-left:4px solid var(--c,var(--accent));padding:14px 16px;border-radius:0 8px 8px 0;margin-bottom:18px}
.primer h3{font-size:1.15rem}
.primer p{margin:0;max-width:72ch}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}

.instrument{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:22px;overflow-x:auto}
.instrument h3{font-size:1.15rem}
.instrument .cap{font-size:.93rem;color:var(--muted)}
.instrument svg text{font-family:var(--sans)}
.datatable{border-collapse:collapse;margin:10px 0 4px;font-size:.97rem}
.datatable th,.datatable td{border-bottom:1px solid var(--line);padding:6px 12px 6px 0;text-align:left}
.datatable td.num{font-variant-numeric:tabular-nums;font-weight:700}
input[type=range]{width:100%;accent-color:var(--accent)}
.readout{font-size:1.05rem;margin-top:6px}
.readout b{font-variant-numeric:tabular-nums}
.meter{height:12px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:6px;max-width:360px}
.meter > i{display:block;height:100%;background:var(--accent);transition:width .15s}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden}
.seg label{padding:6px 12px;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked + span{font-weight:700;color:var(--accent)}
.seg label:has(input:checked){background:var(--card)}
.seg input:focus-visible + span{outline:3px solid var(--accent)}

.hot{cursor:pointer}
.hot circle.hs{fill:var(--accent);fill-opacity:.16;stroke:var(--accent);stroke-width:2}
.hot.seen circle.hs{fill:var(--ok);fill-opacity:.22;stroke:var(--ok)}
.hot:hover circle.hs,.hot:focus circle.hs{fill-opacity:.35}
.obs{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;min-height:120px}
.obs h4{font-size:1.1rem}
.osteo-grid{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:720px){.osteo-grid{grid-template-columns:260px 1fr}}
.reftabs{display:grid;grid-template-columns:1fr;gap:12px;margin-top:14px}
@media (min-width:720px){.reftabs{grid-template-columns:1fr 1fr}}
.refbox{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:.95rem}
.refbox h4{font-size:1rem}
.plates{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin:8px 0 14px}
.plate{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.88rem}
.plate b{font-family:var(--serif);font-size:1.05rem}
.plate.find{border:2px dashed var(--c,var(--accent))}
.plate svg{display:block;margin:4px 0}
.plate .d{color:var(--muted)}
.swords{display:grid;grid-template-columns:1fr;gap:8px;margin:8px 0}
@media (min-width:720px){.swords{grid-template-columns:1fr 1fr}}

/* Opgaver */
.q{border:1.5px solid var(--line);border-radius:10px;padding:16px;margin:14px 0;background:var(--card)}
.q.locked{opacity:.55;background:var(--soft)}
.q.done{border-color:var(--ok);background:var(--ok-bg)}
.q .qh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.q .qn{font-size:.9rem;color:var(--muted);font-weight:700}
.q .prompt{font-weight:700;font-size:1.08rem;margin-bottom:10px;max-width:70ch}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;background:var(--soft);border:1.5px solid var(--line);border-radius:8px;padding:11px 14px;cursor:pointer;line-height:1.4}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.tried{background:var(--bad-bg);border-color:var(--bad);cursor:default}
.opt.picked{border-color:var(--accent);background:var(--card)}
.checks{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.checks label{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--soft);cursor:pointer}
.checks input{margin-top:4px;accent-color:var(--accent);width:18px;height:18px}
.numrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.numrow input{width:9em;padding:9px 10px;border:1.5px solid var(--line);border-radius:6px;background:var(--card);font-variant-numeric:tabular-nums}
.pool,.seq{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.seq{min-height:46px;padding:8px;border:1.5px dashed var(--line);border-radius:8px}
.chip{border:1.5px solid var(--line);background:var(--soft);border-radius:6px;padding:7px 11px;cursor:pointer}
.chip:disabled{opacity:.35;cursor:default}
.seq .chip{background:var(--card);border-color:var(--accent);cursor:default}
.fb{margin-top:10px;padding:10px 12px;border-radius:0 6px 6px 0;max-width:72ch}
.fb.bad{background:var(--bad-bg);border-left:4px solid var(--bad)}
.fb.hint{background:var(--hint-bg);border-left:4px solid var(--gold)}
.fb.ok{background:var(--ok-bg);border-left:4px solid var(--ok)}
.q.done .answer{font-weight:700}
.q.done .noted{margin-top:6px;font-size:.95rem}
.tries{font-size:.85rem;color:var(--muted)}

.cards{display:grid;grid-template-columns:1fr;gap:16px}
.card{border:1.5px solid var(--line);border-radius:10px;padding:16px;background:var(--card)}
.card.done{border-color:var(--ok)}
.card .data{background:var(--soft);border-radius:6px;padding:10px 12px;margin:8px 0 4px;max-width:72ch}
.card .q{margin:10px 0 0;border:0;padding:0;background:transparent}
.card .q.done{background:transparent}

.evidence{margin-top:24px;border-top:2px solid var(--line);padding-top:14px}
.evidence h3{font-size:1.15rem}
.evidence ol{margin:0;padding-left:1.4em}
.evidence li{margin:5px 0;max-width:75ch}
.empty{color:var(--muted);font-style:italic}
.next{margin-top:18px;padding:14px 16px;background:var(--ok-bg);border-radius:8px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}

/* Rapport */
.field{margin:0 0 22px}
.field > label,.field > .lbl{display:block;font-weight:700;font-size:1.05rem;margin-bottom:4px}
.field .help{color:var(--muted);font-size:.95rem;margin-bottom:6px;max-width:72ch}
textarea{width:100%;min-height:84px;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);resize:vertical;line-height:1.5}
select{padding:9px 10px;border:1.5px solid var(--line);border-radius:6px;background:var(--card)}
.claim{border:1.5px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px;background:var(--soft)}
.claim h4{font-size:1.05rem}
.evpick{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.evpick label{display:flex;gap:6px;align-items:center;border:1.5px solid var(--line);border-radius:999px;padding:4px 11px;background:var(--card);cursor:pointer;font-size:.92rem}
.evpick label:has(input:checked){border-color:var(--accent);background:var(--card);font-weight:700}
.evpick input{accent-color:var(--accent)}
.certs{display:flex;gap:6px;flex-wrap:wrap}
.certs label{border:1.5px solid var(--line);border-radius:6px;padding:5px 12px;cursor:pointer;background:var(--card)}
.certs label:has(input:checked){border-color:var(--accent);font-weight:700}
.certs input{accent-color:var(--accent)}
.errors{background:var(--bad-bg);border-left:4px solid var(--bad);padding:12px 16px;border-radius:0 8px 8px 0;margin-bottom:14px}
.errors ul{margin:6px 0 0;padding-left:1.2em}
.evref{font-size:.9rem;color:var(--muted)}

/* Værktøjskassen – ekstra */
.timeline{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.timeline li{display:grid;grid-template-columns:44px 1fr;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.timeline .n{font-family:var(--serif);font-weight:700;font-size:1.6rem;color:var(--muted);line-height:1}
.timeline h3{font-size:1.15rem;margin:0 0 4px}
.timeline p{margin:0 0 8px;max-width:68ch}
.stamps{display:flex;flex-wrap:wrap;gap:6px}
.who{display:flex;flex-wrap:wrap;gap:12px;margin:18px 0 6px}
.who label{display:flex;flex-direction:column;font-weight:700;font-size:.95rem;gap:4px}
.who input{padding:9px 10px;border:1.5px solid var(--line);border-radius:6px;background:var(--card);min-width:14em}
.parts{display:grid;grid-template-columns:1fr;gap:12px;margin-top:22px}
@media (min-width:720px){.parts{grid-template-columns:1fr 1fr}}
.part{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.part:hover{border-color:var(--muted)}
.part h3{font-size:1.2rem;margin:0}
.part p{margin:0;color:var(--muted);font-size:.97rem}
.four{display:grid;grid-template-columns:1fr;gap:8px;margin:0 0 18px}
@media (min-width:720px){.four{grid-template-columns:1fr 1fr}}
.four div{background:var(--soft);border-radius:8px;padding:10px 12px}
.four b{font-family:var(--serif);font-size:1.05rem}
.stmt{border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0;background:var(--card)}
.stmt.done{border-color:var(--ok);background:var(--ok-bg)}
.stmt .txt{font-weight:700;margin-bottom:8px;max-width:72ch}
.stmt .src{font-weight:400;color:var(--muted);font-size:.9rem}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{border:1.5px solid var(--line);background:var(--soft);border-radius:6px;padding:7px 12px;cursor:pointer}
.pick button:hover:not(:disabled){border-color:var(--accent)}
.pick button.wrong{background:var(--bad-bg);border-color:var(--bad)}
.pick button.right{background:var(--card);border-color:var(--ok);font-weight:700}
.mtabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.mtabs button{border:2px solid var(--c);color:var(--c);background:var(--card);border-radius:6px;padding:5px 11px;cursor:pointer;font-family:var(--serif);font-weight:700}
.mtabs button[aria-pressed="true"]{background:var(--c);color:var(--card)}
.mtabs button .ok{margin-left:4px}
.step{border-top:1px solid var(--line);padding-top:14px;margin-top:16px}
.step h4{font-size:1.08rem}
.kk{display:flex;flex-direction:column;gap:8px}
.kk .row2{display:grid;grid-template-columns:1fr;gap:6px;align-items:center;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--soft)}
@media (min-width:640px){.kk .row2{grid-template-columns:1fr auto}}
.kk .row2.ok{border-color:var(--ok);background:var(--ok-bg)}
.kk .row2.bad{border-color:var(--bad);background:var(--bad-bg)}
.kk .row2 .why{grid-column:1/-1;font-size:.93rem}
.cmp{width:100%;border-collapse:collapse}
.cmp th,.cmp td{border-bottom:1px solid var(--line);padding:8px 8px 8px 0;text-align:left;vertical-align:top}
.cmp select{width:100%;max-width:100%}
.cmp td.m{white-space:nowrap}
.cmp tr.ok td{background:var(--ok-bg)}
.cmp tr.bad td{background:var(--bad-bg)}
.fact{margin-top:8px;font-size:.97rem}
.checklist{list-style:none;padding:0;margin:0 0 16px}
.checklist li{padding:4px 0}
.checklist .y{color:var(--ok);font-weight:700}
.checklist .n{color:var(--muted)}
.sumtable{width:100%;border-collapse:collapse;font-size:.95rem;margin:8px 0 18px}
.sumtable th,.sumtable td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.sumtable th{background:var(--soft)}
.dim{color:var(--muted)}
</style>
</head>
<body>
<header class="bar no-print">
  <span class="brand">Værktøjskassen</span>
  <a class="btn ghost small" href="index.html" id="forloebslink" style="text-decoration:none">Forløbet</a>
  <span class="spacer"></span>
  <span class="dim" id="whohead"></span>
</header>
<main class="wrap" id="app"></main>

<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) { if (k == null || k === false) continue; el.append(k.nodeType ? k : document.createTextNode(String(k))); }
  return el;
}
function shuffle(a) { const b = [...a]; for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; }
const words = t => ((t || '').match(/[A-Za-zÆØÅæøåÄÖÜäöüéè0-9]{2,}/g) || []).length;
const canSpeak = 'speechSynthesis' in window;
function speak(t) { if (!canSpeak) return; try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'da-DK'; u.rate = .95; speechSynthesis.speak(u); } catch (e) {} }
const sayBtn = t => canSpeak ? h('button', { class: 'say', type: 'button', onclick: () => speak(t) }, '🔊 Læs op') : null;

/* ---------- Metoder ---------- */
const M = {
  typo:   { name: 'Typologi', c: 'var(--m-typo)' },
  strat:  { name: 'Stratigrafi', c: 'var(--m-strat)' },
  dendro: { name: 'Dendrokronologi', c: 'var(--m-dendro)' },
  c14:    { name: 'Kulstof-14', c: 'var(--m-c14)' },
  sr:     { name: 'Strontiumanalyse', c: 'var(--m-sr)' },
  osteo:  { name: 'Human osteologi', c: 'var(--m-osteo)' }
};
const MK = Object.keys(M);
const stamp = k => h('span', { class: 'stamp sm', style: `--c:${M[k].c}` }, M[k].name);

/* ---------- Tilstand ---------- */
const KEY = 'vaerktoejskassen-v1';
let S = {};
try { S = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { S = {}; }

function vTrin(el) {
  const p = h('div', { class: 'panel' });

  p.append(h('p', { class: 'dim', style: 'max-width:70ch' }, 'Når man arbejder videnskabeligt, skal man skelne skarpt mellem, hvad man ser, hvad man måler, hvad man tror, og hvad man samlet konkluderer. Sæt hver sætning fra forløbet på det rigtige trin.'));

  const list = h('div'); p.append(list); el.append(p);

    list.replaceChildren();
    STMTS.forEach(s => {
      const done = S.trin[s.id];
      const box = h('div', { class: 'stmt' + (done ? ' done' : '') }, h('div', { class: 'txt' }, s.t, ' ', h('span', { class: 'src' }, '(' + s.src + ')')));
      const pick = h('div', { class: 'pick' }), fb = h('div', { 'aria-live': 'polite' });

        const b = h('button', { type: 'button', class: done && k === s.a ? 'right' : '', disabled: done ? true : null }, n);
        b.addEventListener('click', () => {
          if (k === s.a) { S.trin[s.id] = true; save(); draw(); }
          else { b.classList.add('wrong'); b.disabled = true; fb.replaceChildren(h('div', { class: 'fb bad' }, (s.fb && s.fb[k]) || TRIN_FB_DEFAULT[k])); }

  const a = h('div', { class: 'step' }, h('h4', {}, 'Hvad undersøger man?'));
  const aPick = h('div', { class: 'pick' }), aFb = h('div', { 'aria-live': 'polite' });

      else { b.classList.add('wrong'); b.disabled = true; aFb.replaceChildren(h('div', { class: 'fb bad' }, 'Det bruger en anden metode. Hvilket materiale arbejder ' + M[k].name.toLowerCase() + ' med?')); }
    });

  });
  a.append(aPick, aFb); p.append(a);

  // B: kan / kan ikke
  const b = h('div', { class: 'step' }, h('h4', {}, 'Hvad kan metoden – og hvad kan den IKKE?'));
  const kk = h('div', { class: 'kk' });
  KK[k].forEach(([t, can, why], i) => {
    const st = m.kk[i];
    const row = h('div', { class: 'row2' + (st === 'ok' ? ' ok' : st === 'bad' ? ' bad' : '') }, h('span', {}, t));
    const pk = h('div', { class: 'pick' });
    [[true, 'Kan'], [false, 'Kan ikke']].forEach(([v, n]) => {
      const bt = h('button', { type: 'button', class: st === 'ok' && v === can ? 'right' : '', disabled: st === 'ok' ? true : null }, n);
      bt.addEventListener('click', () => { m.kk[i] = v === can ? 'ok' : 'bad'; save(); go('kasse', k); setTimeout(() => { const r = document.querySelectorAll('.kk .row2')[i]; if (r) r.scrollIntoView({ block: 'center' }); }, 0); });
      pk.append(bt);
    });
    row.append(pk);
    if (st === 'bad') row.append(h('div', { class: 'why' }, can ? 'Jo, det kan metoden faktisk. Tænk på eksemplerne fra forløbet.' : why));
    if (st === 'ok' && !can && why) row.append(h('div', { class: 'why' }, why));
    kk.append(row);
  });
  b.append(kk); p.append(b);

  // C: eksempler
  const c = h('div', { class: 'step' }, h('h4', {}, 'Hvor mødte vi metoden i forløbet?'), h('p', { class: 'cap dim' }, 'Vælg de eksempler, hvor metoden blev brugt. Mindst to.'));
  const checks = h('div', { class: 'checks' });
  const inputs = EX.map(([id, t, src]) => { const i = h('input', { type: 'checkbox', checked: m.ex.includes(id) ? true : null, disabled: m.exDone ? true : null }); checks.append(h('label', {}, i, h('span', {}, t, ' ', h('span', { class: 'dim' }, '(' + src + ')')))); return [id, i]; });
  const cFb = h('div', { 'aria-live': 'polite' });
  c.append(checks);
  if (m.exDone) c.append(h('div', { class: 'fb ok' }, 'Godt – eksemplerne passer.'));
  else c.append(h('button', { class: 'btn', type: 'button', onclick: () => {
    const picked = inputs.filter(([, i]) => i.checked).map(([id]) => id);

/* ---------- 3 Sammenlign ---------- */

    let bad = 0; rows.forEach(([k, tr]) => { const ok = S.cmp.str[k] === k && S.cmp.lim[k] === k; tr.className = ok ? 'ok' : 'bad'; if (!ok) bad++; });

  } }, 'Tjek tabellen')), fb);

  const q = h('div', { class: 'panel' }, h('h3', {}, 'Arkæologens metodevurdering'), h('p', { class: 'dim', style: 'max-width:70ch' }, 'Her er der ikke ét rigtigt svar. Det vigtige er, at I begrunder med noget fra forløbet.'));
  const sel = (key) => { const s = h('select', {}, h('option', { value: '' }, 'Vælg metode …'), MK.map(x => h('option', { value: x }, M[x].name))); s.value = S.ev[key]; s.addEventListener('change', () => { S.ev[key] = s.value; save(); }); return s; };
  const ta = (key, ph) => { const t = h('textarea', { placeholder: ph }); t.value = S.ev[key]; t.addEventListener('input', () => { S.ev[key] = t.value; save(); }); return t; };

  q.append(h('div', { class: 'field' }, h('label', {}, '2. Hvilken metode ville I vælge først, hvis I fandt en ukendt grav?'), sel('first'), h('div', { class: 'help', style: 'margin-top:8px' }, 'Hvorfor?'), ta('firstWhy', 'Vi ville starte med …, fordi …')));

/* ---------- 4 Egtvedpigen igen ---------- */
function vEgtved(el) {

  const d = h('div', { class: 'panel' });
  d.append(h('h3', {}, 'Ny forskning ryster konklusionen'));

  d.append(h('div', { class: 'row between' }, h('p', { style: 'max-width:70ch;margin:0' }, deb), sayBtn(deb)));
  const dFb = h('div', { 'aria-live': 'polite' });

    ['At strontiumanalyse er noget pjat, som vi skal glemme.', false, 'Metoden er god nok – men resultatet afhænger af referencekortet. Når kortet er usikkert, bliver konklusionen det også.'],

  shuffle(dOpts).forEach(([t, ok, fb]) => {
    const b = h('button', { class: 'opt' + (S.eg.debate && ok ? ' picked' : ''), type: 'button', disabled: S.eg.debate ? true : null }, (S.eg.debate && ok ? '✓ ' : '') + t);
    b.addEventListener('click', () => { if (ok) { S.eg.debate = true; save(); go('egtved'); } else { b.classList.add('tried'); b.disabled = true; dFb.replaceChildren(h('div', { class: 'fb bad' }, fb)); } });
    dp.append(b);

  d.append(dp, dFb);
  if (S.eg.debate) d.append(h('div', { class: 'fb ok' }, 'Præcis. Sådan arbejder videnskaben: Nye data kan gøre en konklusion stærkere eller svagere. Derfor er det vigtigt at sige, hvor sikker man er.'));
  el.append(d);

  const bs = h('select', {}, h('option', { value: '' }, 'Vælg spor …'), CLUES.map(c => h('option', { value: c.id }, c.t)), h('option', { value: 'andet' }, 'Noget andet'));

  v.append(h('div', { class: 'field' }, h('label', {}, 'Hvilket spor var det vigtigste?'), bs, h('div', { class: 'help', style: 'margin-top:8px' }, 'Begrund jeres valg: Hvorfor er netop dette bevis det stærkeste?'), ta('bestWhy', 'Det stærkeste bevis er …, fordi …')));

/* ---------- Min værktøjskasse ---------- */
function esc(t) { const d = document.createElement('div'); d.textContent = t == null ? '' : String(t); return d.innerHTML; }

  }).join('');

  return `<!DOCTYPE html><html lang="da"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Min værktøjskasse – ${esc(S.name || 'arkæologi')}</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Zilla+Slab:wght@500;700&display=swap" rel="stylesheet">
<style>
body{font-family:'Atkinson Hyperlegible','Segoe UI',Arial,sans-serif;color:#1B2A2F;margin:0;background:#E8EDE9;font-size:11pt;line-height:1.4}

</style></head><body>
<div class="page">

const inClaude = !!(window.claude && typeof window.claude.use === 'function');
let dlP = null;
const getDl = () => dlP || (dlP = inClaude ? Promise.resolve(window.claude.use('downloads')).catch(() => null) : Promise.resolve(null));

async function saveHandout(btn) {

    else if (inClaude) status.textContent = 'Download er ikke muligt i denne visning.';
    else { const url = URL.createObjectURL(new Blob([html], { type: 'text/html' })); const a = h('a', { href: url, download: fn }); document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 10000); status.textContent = 'Filen er hentet – se under Overførsler.'; }

    h('tbody', {}, MK.map(k => { const m = ms(k); return h('tr', {}, h('td', {}, stamp(k)), h('td', {}, m.how || h('span', { class: 'dim' }, '—')), h('td', {}, m.exDone ? m.ex.map(exName).join(', ') : h('span', { class: 'dim' }, '—'))); })));
