<html lang="da">
<head>
<meta charset="UTF-8">

<title>Arkæologens værktøjskasse</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#E8EDE9; --card:#FFFFFF; --soft:#F3F6F4; --ink:#1B2A2F; --muted:#55666A; --line:#C6D0CA;
  --accent:#1F5FA8; --accent-ink:#FFFFFF; --ok:#23764A; --ok-bg:#E2F1E7; --gold:#B38A2E; --hint-bg:#FBF0D6;

  --sans:'Atkinson Hyperlegible', 'Segoe UI', Verdana, Arial, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11181A; --card:#1A2326; --soft:#161E21; --ink:#E4ECE9; --muted:#9CAFB0; --line:#34423F;
    --accent:#7BAAE8; --accent-ink:#0D1824; --ok:#6BC896; --ok-bg:#15301F; --gold:#D9B45A; --hint-bg:#342B14;
    --t-O:#5DC4AE; --t-A:#7BAAE8; --t-F:#D8B447; --t-K:#E28BA1;
  }
}
:root[data-theme="dark"]{
  --paper:#11181A; --card:#1A2326; --soft:#161E21; --ink:#E4ECE9; --muted:#9CAFB0; --line:#34423F;
  --accent:#7BAAE8; --accent-ink:#0D1824; --ok:#6BC896; --ok-bg:#15301F; --gold:#D9B45A; --hint-bg:#342B14;
  --t-O:#5DC4AE; --t-A:#7BAAE8; --t-F:#D8B447; --t-K:#E28BA1;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:1.0625rem;line-height:1.55}
button,input,textarea{font:inherit;color:inherit}
a{color:var(--accent)}

h1,h2,h3{font-family:var(--serif);line-height:1.15;margin:0 0 .4em}
p{margin:0 0 .8em}
.bar{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--card)}
.bar .brand{font-family:var(--serif);font-weight:700;font-size:1.15rem}
.bar .spacer{flex:1}
.bar .saved{color:var(--muted);font-size:.9rem}
.wrap{max-width:860px;margin:0 auto;padding:24px 20px 70px}
.btn{display:inline-block;background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:10px 16px;font-weight:700;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{padding:6px 10px;font-size:.92rem}
.kicker{color:var(--muted);margin-bottom:4px}
h1{font-size:clamp(2rem,5.5vw,3rem)}
.intro{color:var(--muted);max-width:66ch}
.who{display:flex;flex-wrap:wrap;gap:12px;margin:16px 0 8px}
.who label{display:flex;flex-direction:column;font-weight:700;font-size:.95rem;gap:4px}
.who input{padding:9px 10px;border:1.5px solid var(--line);border-radius:6px;background:var(--card);min-width:14em}
.progress{color:var(--muted);font-size:.95rem;margin-bottom:6px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin:18px 0}
.sec > h2{font-size:1.45rem}
.sec .task{background:var(--soft);border-radius:8px;padding:10px 12px;margin-bottom:12px;max-width:70ch}
.q{margin:16px 0 0}
.q > .lbl{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;font-weight:700;margin-bottom:6px;max-width:72ch}
.tag{font-size:.78rem;font-weight:700;border:1.5px solid var(--c);color:var(--c);border-radius:4px;padding:0 6px;white-space:nowrap}
textarea{width:100%;min-height:74px;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);resize:vertical;line-height:1.5}
textarea.short{min-height:46px}
input.line{width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:8px;background:var(--card)}
.three{display:grid;grid-template-columns:1fr;gap:6px}
.choices{display:flex;flex-wrap:wrap;gap:6px}
.choices button{border:1.5px solid var(--line);background:var(--soft);border-radius:6px;padding:8px 13px;cursor:pointer}
.choices button:hover{border-color:var(--accent)}
.choices button[aria-pressed="true"]{border-color:var(--accent);background:var(--card);font-weight:700;box-shadow:inset 0 0 0 1px var(--accent)}
.choices button[aria-pressed="true"]::before{content:"✓ "}
.other{margin-top:8px}
.scale{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.scale button{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--soft);cursor:pointer;font-weight:700}
.scale button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.scale .end{color:var(--muted);font-size:.9rem}
.model{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--soft)}
.model .ph{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 14px}
.model iframe{display:block;width:100%;aspect-ratio:16/10;border:0;background:#000}
.gloss{background:var(--hint-bg);border-left:4px solid var(--gold);border-radius:0 10px 10px 0;padding:14px 18px;margin:18px 0}
.gloss dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 14px}
.gloss dt{font-weight:700}
.gloss dd{margin:0}
.done{background:var(--ok-bg);border-left:4px solid var(--ok);border-radius:0 10px 10px 0;padding:14px 18px;margin:22px 0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.status{color:var(--muted);font-size:.93rem}
@media print{body{background:#fff}.bar,.no-print{display:none!important}.sec{break-inside:avoid;border-color:#999}.model iframe{display:none}}
</style>
</head>
