<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laboratoriet – seks sager fra jorden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Zilla+Slab:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#E8EDE9; --card:#FFFFFF; --soft:#F3F6F4; --ink:#1B2A2F; --muted:#55666A; --line:#C6D0CA;
  --accent:#1F5FA8; --accent-ink:#FFFFFF;
  --ok:#23764A; --ok-bg:#E2F1E7; --bad:#A8322A; --bad-bg:#F8E5E2; --hint-bg:#FBF0D6;
  --m-sr:#6E4A9E; --m-c14:#1F5FA8; --m-dendro:#8A5A2B; --m-strat:#8C6A00; --m-typo:#257566; --m-osteo:#9C3D54; --m-other:#55666A;
  --gold:#B38A2E; --soil1:#6B5A45; --soil2:#B79A6A; --soil3:#8C7A5C; --char:#3A3431; --sand:#D9C38F; --brick:#A4553A;
  --serif:'Zilla Slab', Rockwell, 'Roboto Slab', Georgia, serif;
  --sans:'Atkinson Hyperlegible', 'Segoe UI', Verdana, Arial, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11181A; --card:#1A2326; --soft:#161E21; --ink:#E4ECE9; --muted:#9CAFB0; --line:#34423F;
    --accent:#7BAAE8; --accent-ink:#0D1824;
    --ok:#6BC896; --ok-bg:#15301F; --bad:#F08B7F; --bad-bg:#3A1C19; --hint-bg:#342B14;
    --m-sr:#B397DB; --m-c14:#7BAAE8; --m-dendro:#D39B63; --m-strat:#D8B447; --m-typo:#5DC4AE; --m-osteo:#E28BA1; --m-other:#9CAFB0;
    --gold:#D9B45A; --soil1:#7A6850; --soil2:#9E8660; --soil3:#6E604A; --char:#2A2523; --sand:#B8A276; --brick:#B4674B;
  }
}
:root[data-theme="dark"]{
  --paper:#11181A; --card:#1A2326; --soft:#161E21; --ink:#E4ECE9; --muted:#9CAFB0; --line:#34423F;
  --accent:#7BAAE8; --accent-ink:#0D1824;
  --ok:#6BC896; --ok-bg:#15301F; --bad:#F08B7F; --bad-bg:#3A1C19; --hint-bg:#342B14;
  --m-sr:#B397DB; --m-c14:#7BAAE8; --m-dendro:#D39B63; --m-strat:#D8B447; --m-typo:#5DC4AE; --m-osteo:#E28BA1; --m-other:#9CAFB0;
  --gold:#D9B45A; --soil1:#7A6850; --soil2:#9E8660; --soil3:#6E604A; --char:#2A2523; --sand:#B8A276; --brick:#B4674B;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:1.0625rem;line-height:1.55}
img,svg{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--serif);line-height:1.15;margin:0 0 .4em}
p{margin:0 0 .8em}

.bar{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--card)}
.bar .brand{font-family:var(--serif);font-weight:700;font-size:1.2rem}
.bar .spacer{flex:1}
.wrap{max-width:940px;margin:0 auto;padding:24px 20px 60px}

.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:10px 16px;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{padding:6px 10px;font-size:.92rem}
.linkbtn{background:none;border:0;color:var(--accent);cursor:pointer;padding:4px 0;font-weight:700}
.say{background:transparent;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.85rem;cursor:pointer;color:var(--muted);white-space:nowrap}
.say:hover{color:var(--ink);border-color:var(--muted)}

/* Forside */
.hero{margin:18px 0 28px;max-width:62ch}
.hero h1{font-size:clamp(2.2rem,6vw,3.6rem);font-weight:700;letter-spacing:-.01em}
.hero p{font-size:1.15rem;color:var(--muted)}
.tags{display:grid;grid-template-columns:1fr;gap:18px}
@media (min-width:720px){.tags{grid-template-columns:1fr 1fr}}
.tag{position:relative;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:4px 14px 14px 4px;padding:20px 20px 18px 50px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.tag::before{content:"";position:absolute;left:17px;top:24px;width:14px;height:14px;border-radius:50%;background:var(--paper);border:2px solid var(--line)}
.tag:hover{border-color:var(--muted)}
.tag .nr{font-size:.9rem;color:var(--muted)}
.tag h3{font-size:1.4rem;margin:0}
.tag .place{color:var(--muted);font-size:.95rem}
.tag .teaser{font-size:.98rem;margin:4px 0 6px}
.tag .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:auto}
.status{font-size:.88rem;color:var(--muted)}
.status.done{color:var(--ok);font-weight:700}
.stamp{display:inline-block;font-family:var(--serif);font-weight:700;color:var(--c);border:2px solid var(--c);border-radius:4px;padding:1px 9px;transform:rotate(-3deg);font-size:1rem;background:var(--card);white-space:nowrap}
.stamp.sm{font-size:.82rem;padding:0 6px;border-width:1.5px;transform:none}
.foot-note{margin-top:36px;color:var(--muted);font-size:.93rem;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}

/* Sag */
.casehead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.casehead h2{font-size:clamp(1.7rem,4.5vw,2.4rem);margin:0}
.casehead .place{color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tabs button{background:none;border:0;padding:10px 14px;cursor:pointer;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px}
.panel + .panel{margin-top:18px}
.story{font-size:1.1rem;max-width:68ch}
.finds{margin:6px 0 0;padding-left:1.2em}
.finds li{margin:3px 0}
.primer{background:var(--soft);border-left:4px solid var(--c,var(--accent));padding:14px 16px;border-radius:0 8px 8px 0;margin-bottom:18px}
.primer h3{font-size:1.15rem}
.primer p{margin:0;max-width:72ch}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}

.instrument{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:22px;overflow-x:auto}
.instrument h3{font-size:1.15rem}
.instrument .cap{font-size:.93rem;color:var(--muted)}
.instrument svg text{font-family:var(--sans)}
.datatable{border-collapse:collapse;margin:10px 0 4px;font-size:.97rem}
.datatable th,.datatable td{border-bottom:1px solid var(--line);padding:6px 12px 6px 0;text-align:left}
.datatable td.num{font-variant-numeric:tabular-nums;font-weight:700}
input[type=range]{width:100%;accent-color:var(--accent)}
.readout{font-size:1.05rem;margin-top:6px}
.readout b{font-variant-numeric:tabular-nums}
.meter{height:12px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:6px;max-width:360px}
.meter > i{display:block;height:100%;background:var(--accent);transition:width .15s}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden}
.seg label{padding:6px 12px;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked + span{font-weight:700;color:var(--accent)}
.seg label:has(input:checked){background:var(--card)}
.seg input:focus-visible + span{outline:3px solid var(--accent)}

.hot{cursor:pointer}
.hot circle.hs{fill:var(--accent);fill-opacity:.16;stroke:var(--accent);stroke-width:2}
.hot.seen circle.hs{fill:var(--ok);fill-opacity:.22;stroke:var(--ok)}
.hot:hover circle.hs,.hot:focus circle.hs{fill-opacity:.35}
.obs{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;min-height:120px}
.obs h4{font-size:1.1rem}
.osteo-grid{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:720px){.osteo-grid{grid-template-columns:260px 1fr}}
.reftabs{display:grid;grid-template-columns:1fr;gap:12px;margin-top:14px}
@media (min-width:720px){.reftabs{grid-template-columns:1fr 1fr}}
.refbox{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:.95rem}
.refbox h4{font-size:1rem}
.plates{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin:8px 0 14px}
.plate{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.88rem}
.plate b{font-family:var(--serif);font-size:1.05rem}
.plate.find{border:2px dashed var(--c,var(--accent))}
.plate svg{display:block;margin:4px 0}
.plate .d{color:var(--muted)}
.swords{display:grid;grid-template-columns:1fr;gap:8px;margin:8px 0}
@media (min-width:720px){.swords{grid-template-columns:1fr 1fr}}

/* Opgaver */
.q{border:1.5px solid var(--line);border-radius:10px;padding:16px;margin:14px 0;background:var(--card)}
.q.locked{opacity:.55;background:var(--soft)}
.q.done{border-color:var(--ok);background:var(--ok-bg)}
.q .qh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.q .qn{font-size:.9rem;color:var(--muted);font-weight:700}
.q .prompt{font-weight:700;font-size:1.08rem;margin-bottom:10px;max-width:70ch}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;background:var(--soft);border:1.5px solid var(--line);border-radius:8px;padding:11px 14px;cursor:pointer;line-height:1.4}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.tried{background:var(--bad-bg);border-color:var(--bad);cursor:default}
.opt.picked{border-color:var(--accent);background:var(--card)}
.checks{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.checks label{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--soft);cursor:pointer}
.checks input{margin-top:4px;accent-color:var(--accent);width:18px;height:18px}
.numrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.numrow input{width:9em;padding:9px 10px;border:1.5px solid var(--line);border-radius:6px;background:var(--card);font-variant-numeric:tabular-nums}
.pool,.seq{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.seq{min-height:46px;padding:8px;border:1.5px dashed var(--line);border-radius:8px}
.chip{border:1.5px solid var(--line);background:var(--soft);border-radius:6px;padding:7px 11px;cursor:pointer}
.chip:disabled{opacity:.35;cursor:default}
.seq .chip{background:var(--card);border-color:var(--accent);cursor:default}
.fb{margin-top:10px;padding:10px 12px;border-radius:0 6px 6px 0;max-width:72ch}
.fb.bad{background:var(--bad-bg);border-left:4px solid var(--bad)}
.fb.hint{background:var(--hint-bg);border-left:4px solid var(--gold)}
.fb.ok{background:var(--ok-bg);border-left:4px solid var(--ok)}
.q.done .answer{font-weight:700}
.q.done .noted{margin-top:6px;font-size:.95rem}
.tries{font-size:.85rem;color:var(--muted)}

.cards{display:grid;grid-template-columns:1fr;gap:16px}
.card{border:1.5px solid var(--line);border-radius:10px;padding:16px;background:var(--card)}
.card.done{border-color:var(--ok)}
.card .data{background:var(--soft);border-radius:6px;padding:10px 12px;margin:8px 0 4px;max-width:72ch}
.card .q{margin:10px 0 0;border:0;padding:0;background:transparent}
.card .q.done{background:transparent}

.evidence{margin-top:24px;border-top:2px solid var(--line);padding-top:14px}
.evidence h3{font-size:1.15rem}
.evidence ol{margin:0;padding-left:1.4em}
.evidence li{margin:5px 0;max-width:75ch}
.empty{color:var(--muted);font-style:italic}
.next{margin-top:18px;padding:14px 16px;background:var(--ok-bg);border-radius:8px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}

/* Rapport */
.field{margin:0 0 22px}
.field > label,.field > .lbl{display:block;font-weight:700;font-size:1.05rem;margin-bottom:4px}
.field .help{color:var(--muted);font-size:.95rem;margin-bottom:6px;max-width:72ch}
textarea{width:100%;min-height:84px;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);resize:vertical;line-height:1.5}
select{padding:9px 10px;border:1.5px solid var(--line);border-radius:6px;background:var(--card)}
.claim{border:1.5px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px;background:var(--soft)}
.claim h4{font-size:1.05rem}
.evpick{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.evpick label{display:flex;gap:6px;align-items:center;border:1.5px solid var(--line);border-radius:999px;padding:4px 11px;background:var(--card);cursor:pointer;font-size:.92rem}
.evpick label:has(input:checked){border-color:var(--accent);background:var(--card);font-weight:700}
.evpick input{accent-color:var(--accent)}
.certs{display:flex;gap:6px;flex-wrap:wrap}
.certs label{border:1.5px solid var(--line);border-radius:6px;padding:5px 12px;cursor:pointer;background:var(--card)}
.certs label:has(input:checked){border-color:var(--accent);font-weight:700}
.certs input{accent-color:var(--accent)}
.errors{background:var(--bad-bg);border-left:4px solid var(--bad);padding:12px 16px;border-radius:0 8px 8px 0;margin-bottom:14px}
.errors ul{margin:6px 0 0;padding-left:1.2em}
.evref{font-size:.9rem;color:var(--muted)}

/* Slides */
.slides{display:flex;flex-direction:column;gap:18px}
.slide{background:#FFFFFF;color:#1B2A2F;border:1px solid var(--line);border-radius:6px;aspect-ratio:16/9;padding:4% 5%;overflow:hidden;display:flex;flex-direction:column}
.slide .sk{font-size:.9rem;color:#55666A;margin-bottom:.4em}
.slide h2{font-size:clamp(1.3rem,3.2vw,2.2rem);margin-bottom:.5em;color:#1B2A2F}
.slide p,.slide li{font-size:clamp(.8rem,1.6vw,1.1rem)}
.slide .cols{display:grid;grid-template-columns:3fr 2fr;gap:5%;flex:1;min-height:0}
.slide ul{padding-left:1.1em;margin:0}
.slide .cert{display:inline-block;font-size:.78em;font-weight:700;border:1.5px solid currentColor;border-radius:4px;padding:0 6px;margin-right:6px;vertical-align:1px}
.slide .cert.s{color:#23764A}.slide .cert.p{color:#1F5FA8}.slide .cert.m{color:#8C6A00}
.slide .stamp{background:#fff}
.slide .small{font-size:.85em;color:#55666A}
.guide{background:var(--hint-bg);border-left:5px solid var(--gold);border-radius:0 10px 10px 0;padding:14px 18px;margin-bottom:18px}
.guide h4{font-size:1.1rem;margin-bottom:4px}
.guide p{margin:0;max-width:72ch}
.demo-entry{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:var(--card);border:2px dashed var(--gold);border-radius:14px;padding:18px 22px;margin-bottom:22px;cursor:pointer}
.demo-entry:hover{border-style:solid}
.demo-entry h3{font-size:1.3rem;margin:0 0 2px}
.demo-entry p{margin:0;color:var(--muted);max-width:60ch}
details.expert{margin-top:18px;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:14px 18px}
details.expert summary{cursor:pointer;font-weight:700;font-family:var(--serif);font-size:1.15rem}
details.expert p{max-width:72ch;margin-top:10px}

@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

@media print{
  @page{size:A4 landscape;margin:12mm}
  body{background:#fff;color:#000}
  .no-print{display:none!important}
  .wrap{max-width:none;padding:0}
  .slides{gap:0}
  .slide{border:0;border-radius:0;aspect-ratio:auto;height:180mm;padding:0;break-after:page;page-break-after:always}
  .slide:last-child{break-after:auto;page-break-after:auto}
  .slide h2{font-size:30pt}
  .slide p,.slide li{font-size:15pt}
}
</style>
</head>
<body>
<header class="bar no-print">
  <span class="brand">Laboratoriet</span>
  <a class="btn ghost small" href="index.html" id="forloebslink" style="text-decoration:none">Forløbet</a>
  <span class="spacer"></span>
  <button class="btn ghost small" id="homebtn" hidden>Alle sager</button>
</header>
<main class="wrap" id="app"></main>

<script>
"use strict";
/* ---------- Hjælpere ---------- */
const $ = (s, r = document) => r.querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k === 'style') el.setAttribute('style', v);
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) {
    if (k == null || k === false) continue;
    el.append(k.nodeType ? k : document.createTextNode(String(k)));
  }
  return el;
}
const dk = (n, d) => n.toFixed(d).replace('.', ',');
function shuffle(a) { const b = [...a]; for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; }
function parseNum(s) { if (s == null) return NaN; s = String(s).trim().replace(/\s/g, '').replace(',', '.').replace(/^−/, '-'); return s === '' ? NaN : Number(s); }

const canSpeak = 'speechSynthesis' in window;
function speak(text) {
  if (!canSpeak) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = 'da-DK'; u.rate = .95; speechSynthesis.speak(u); } catch (e) {}
}
function sayBtn(getText) { return canSpeak ? h('button', { class: 'say', type: 'button', 'aria-label': 'Læs op', onclick: () => speak(typeof getText === 'function' ? getText() : getText) }, '🔊 Læs op') : null; }

/* ---------- Metoder ---------- */
const METHODS = {
  sr:     { name: 'Strontiumisotopanalyse', short: 'Strontium',       c: 'var(--m-sr)' },
  c14:    { name: 'Kulstof-14 (C-14)',      short: 'Kulstof-14',      c: 'var(--m-c14)' },
  dendro: { name: 'Dendrokronologi',        short: 'Dendrokronologi', c: 'var(--m-dendro)' },
  strat:  { name: 'Stratigrafi',            short: 'Stratigrafi',     c: 'var(--m-strat)' },
  typo:   { name: 'Typologi',               short: 'Typologi',        c: 'var(--m-typo)' },
  osteo:  { name: 'Human osteologi',        short: 'Osteologi',       c: 'var(--m-osteo)' },
  bot:    { name: 'Botanik',                short: 'Botanik',         c: 'var(--m-other)' },
  grav:   { name: 'Gravskik',               short: 'Gravskik',        c: 'var(--m-other)' },
  tekstil:{ name: 'Tekstil',                short: 'Tekstil',         c: 'var(--m-other)' },
};
const stamp = (m, sm) => h('span', { class: 'stamp' + (sm ? ' sm' : ''), style: `--c:${METHODS[m].c}` }, METHODS[m].short);

/* ---------- Tilstand ---------- */
const KEY = 'laboratoriet-v2';
let S = { cases: {} };
try { const raw = localStorage.getItem(KEY); if (raw) S = JSON.parse(raw) || S; } catch (e) {}
if (!S.cases) S.cases = {};
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function cs(id) { if (!S.cases[id]) S.cases[id] = { done: {}, notes: [], draft: {}, report: false }; return S.cases[id]; }
function addNote(id, text, method) { const c = cs(id); if (!c.notes.some(n => n.text === text)) c.notes.push({ text, method }); save(); }

/* =====================================================================
   SAGERNE (opdigtede, men metoderne og tallene er realistiske)
   ===================================================================== */
const CASES = [
/* ---------------- 1 STRONTIUM ---------------- */
{
  id: 'raevehoej', nr: '01', method: 'sr', widget: 'sr',
  title: 'Kvinden i egekisten', place: 'Rævehøj, Midtjylland',
  teaser: 'En ung kvinde i en egekiste med en bælteplade af bronze. Der findes ingen bronze i dansk jord. Hvor kom hun fra?',
  story: [

/* ---- Dendrokronologi ---- */
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const DY0 = 850, DY1 = 1000, DN = 40, DEND = 962;
function makeSeries(seed, dry) { const r = rng(seed), a = []; for (let y = DY0; y <= DY1; y++) a.push(0.55 + (r() + r() + r()) / 3 * 1.0); dry.forEach(y => a[y - DY0] = 0.2 + r() * 0.08); return a; }
const REF = { nor: makeSeries(11, [931, 947, 958]), dk: makeSeries(47, [918, 940, 953, 974]) };
const SAMPLE = (() => { const r = rng(5), s = []; for (let i = 0; i < DN; i++) { const y = DEND - DN + 1 + i; s.push(REF.nor[y - DY0] * 1.1 + (r() - .5) * .34); } return s; })();
function corr(a, b) { const n = a.length; const ma = a.reduce((x, y) => x + y) / n, mb = b.reduce((x, y) => x + y) / n; let num = 0, da = 0, db = 0; for (let i = 0; i < n; i++) { num += (a[i] - ma) * (b[i] - mb); da += (a[i] - ma) ** 2; db += (b[i] - mb) ** 2; } return num / Math.sqrt(da * db); }

    const btn = h('button', { class: 'btn', type: 'button' }, 'Tjek svar');
    const check = () => {
      const v = parseNum(inp.value);
      if (isNaN(v)) { showFb('hint', 'Skriv et tal.'); return; }
      if (Math.abs(v - q.answer) <= q.tol) { success(inp.value.trim() + (q.unit ? ' ' + q.unit : '')); return; }
      tries++;
      const sp = (q.special || []).find(x => Math.abs(v - x.v) <= x.tol);
      if (sp) showFb('hint', sp.fb);
      else showFb('bad', (Math.abs(v - q.answer) <= q.tol * 3 + 1 ? 'Tæt på, men ikke helt. ' : 'Det passer ikke med data. ') + (q.hint || ''));
    };
    btn.addEventListener('click', check);
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') check(); });
    wrap.append(h('div', { class: 'numrow' }, inp, q.unit ? h('span', {}, q.unit) : null, btn));
  }
  if (q.type === 'order') {
    const seq = [];
    const pool = h('div', { class: 'pool' }), seqBox = h('div', { class: 'seq', 'aria-label': 'Jeres rækkefølge' });
    const btns = shuffle(q.items).map(t => {
      const b = h('button', { class: 'chip', type: 'button' }, t);
      b.addEventListener('click', () => { seq.push(t); b.disabled = true; drawSeq(); });
      pool.append(b); return b;
    });
    function drawSeq() { seqBox.replaceChildren(...(seq.length ? seq.map((t, i) => h('span', { class: 'chip' }, (i + 1) + '. ' + t)) : [h('span', { class: 'empty' }, 'Ældst først …')])); }
    drawSeq();
    const reset = h('button', { class: 'btn ghost', type: 'button' }, 'Start forfra');
    reset.addEventListener('click', () => { seq.length = 0; btns.forEach(b => b.disabled = false); drawSeq(); fb.replaceChildren(); });
    const btn = h('button', { class: 'btn', type: 'button' }, 'Tjek rækkefølge');
    btn.addEventListener('click', () => {
      if (seq.length < q.items.length) { showFb('hint', 'Placér alle lagene først.'); return; }
      const right = seq.filter((t, i) => t === q.items[i]).length;
      if (right === q.items.length) success(seq.join(' → '));
      else { tries++; showFb('bad', `${right} af ${q.items.length} står på den rigtige plads. ${q.hint || ''}`); }
    });
    wrap.append(h('div', { class: 'cap' }, 'Klik i rækkefølge:'), pool, seqBox, h('div', { class: 'row' }, btn, reset));
  }
  wrap.append(fb);
  return wrap;
}

const CERTS = [['s', 'Sikkert'], ['p', 'Sandsynligt'], ['m', 'Muligt']];
const words = t => (t.match(/[A-Za-zÆØÅæøåÄÖÜäöüéè0-9]{2,}/g) || []).length;

    if (words(d.unknown) < 6 || !looksReal(d.unknown)) e.push('Skriv i en hel sætning, hvad I ikke kan vide ud fra data (mindst 6 ord).');

      try { await dl.save({ filename, data: html }); status.textContent = 'Filen er gemt. Åbn den for at fremlægge.'; }
      catch (e) { status.textContent = e && e.code === 'declined' ? 'Download blev annulleret.' : 'Download er ikke muligt her lige nu.'; }
    } else if (inClaude) {
      status.textContent = 'Download er ikke muligt i denne visning.';
    } else {
      const url = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
      const a = h('a', { href: url, download: filename }); document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
      status.textContent = 'Filen er hentet – se under Overførsler.';
    }
  } finally { btn.disabled = false; }
}

      h('div', {}, h('p', {}, h('strong', {}, 'Datering: '), d.dwhen.trim(), ' ', h('span', { class: 'small' }, `(${d.dtype === 'begge' ? 'relativ og absolut' : d.dtype})`)),
        h('p', {}, h('strong', {}, 'Det kan vi ikke vide: '), d.unknown.trim())))));
